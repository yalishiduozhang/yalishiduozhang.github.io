# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: 亚里士AI说
subtitle: 欢迎来到亚里士多章的小屋
description: 欢迎来到亚里士多章的小屋
keywords: AI,人工智能,机器学习,图神经网络,CS224W
author: 亚里士多章
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://yalishiduozhang.github.io
permalink: :year/:month/:day/:abbrlink/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 随感
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: anzhiyu

# Local search. The AnZhiYu theme reads search.xml generated here.
search:
  path: search.xml
  field: post
  content: true
  format: html

# Server-side math tag plugin support from hexo-math.
math:
  katex:
    css: https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css
    options:
      throwOnError: false
  mathjax:
    css: https://cdn.jsdelivr.net/npm/hexo-math@5.0.0/dist/style.css
    options:
      conversion:
        display: false
      tex:
      svg:

# Deployment
deploy:
  type: git
  repo: git@github.com:yalishiduozhang/yalishiduozhang.github.io.git
  branch: main
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"
